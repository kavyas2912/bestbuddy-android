# src-tauri/Cargo.toml
[package]
name = "vce-mobile"
version = "1.11.8"
edition = "2021"

[lib]
name = "vce_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
vce-core = { path = "../vce-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
